<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bezier Pen Tool Exporter</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #1d1f20;
      color: #f3f3f3;
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    .app {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .left {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      border-right: 1px solid #333;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 12px;
      background: #26292b;
      border-bottom: 1px solid #333;
      align-items: center;
    }

    .toolbar-group {
      display: flex;
      gap: 6px;
      padding-right: 10px;
      margin-right: 4px;
      border-right: 1px solid #3a3f43;
    }

    button {
      border: none;
      background: #444b52;
      color: #fff;
      padding: 7px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      white-space: nowrap;
    }

    button:hover {
      opacity: 0.9;
    }

    button.primary {
      background: #3a82f6;
    }

    button.success {
      background: #16a34a;
    }

    button.danger {
      background: #dc2626;
    }

    button.active {
      background: #f59e0b;
      color: #111827;
      font-weight: 700;
    }

    .hint {
      color: #c8c8c8;
      font-size: 12px;
      line-height: 1.5;
      padding-left: 2px;
    }

    .stage-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(to right, rgba(255,255,255,0.045) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.045) 1px, transparent 1px),
        #1d1f20;
      background-size: 24px 24px, 24px 24px, auto;
    }

    svg#stage {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
      user-select: none;
    }

    svg#stage.mode-select {
      cursor: default;
    }

    svg#stage.mode-pan {
      cursor: grab;
    }

    svg#stage.panning {
      cursor: grabbing;
    }

    .hud {
      position: absolute;
      left: 12px;
      bottom: 12px;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.48);
      border: 1px solid rgba(255,255,255,0.12);
      color: #d6d6d6;
      font-size: 12px;
      line-height: 1.6;
      pointer-events: none;
      min-width: 190px;
    }

    .right {
      width: 440px;
      display: flex;
      flex-direction: column;
      background: #202325;
    }

    .panel {
      padding: 12px 14px;
      border-bottom: 1px solid #333;
    }

    .panel h3 {
      margin: 0 0 8px;
      font-size: 15px;
      font-weight: 600;
    }

    .panel p {
      margin: 6px 0;
      font-size: 13px;
      color: #c9c9c9;
      line-height: 1.6;
    }

    code {
      color: #a7f3d0;
    }

    .stats {
      font-size: 13px;
      color: #d8d8d8;
      line-height: 1.8;
      word-break: break-all;
    }

    textarea {
      flex: 1;
      width: 100%;
      resize: none;
      border: none;
      outline: none;
      background: #17191a;
      color: #eaeaea;
      padding: 14px;
      font-size: 13px;
      line-height: 1.6;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .footer-actions {
      padding: 12px 14px;
      border-top: 1px solid #333;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .main-path {
      fill: none;
      stroke: #5eead4;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .ghost-path {
      fill: none;
      stroke: rgba(94,234,212,0.16);
      stroke-width: 12;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .helper-line {
      stroke: rgba(255,255,255,0.28);
      stroke-width: 1.5;
      stroke-dasharray: 5 4;
      vector-effect: non-scaling-stroke;
    }

    .anchor,
    .control,
    .start-point {
      stroke: #fff;
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
      cursor: move;
    }

    .start-point {
      fill: #ef4444;
    }

    .anchor {
      fill: #f59e0b;
    }

    .control {
      fill: #3b82f6;
    }

    .selected-point {
      stroke: #fef08a;
      stroke-width: 4;
      filter: drop-shadow(0 0 5px rgba(250, 204, 21, 0.8));
    }

    .label {
      fill: rgba(255,255,255,0.85);
      pointer-events: none;
      user-select: none;
    }

    .selection-rect {
      fill: rgba(59, 130, 246, 0.12);
      stroke: rgba(147, 197, 253, 0.9);
      stroke-width: 1.5;
      stroke-dasharray: 6 4;
      vector-effect: non-scaling-stroke;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="left">
      <div class="toolbar">
        <div class="toolbar-group">
          <button id="modePen" class="active">钢笔</button>
          <button id="modeSelect">选择/框选</button>
          <button id="modePan">平移</button>
        </div>

        <div class="toolbar-group">
          <button id="btnZoomIn">放大</button>
          <button id="btnZoomOut">缩小</button>
          <button id="btnResetView">重置视图</button>
        </div>

        <div class="toolbar-group">
          <button id="btnUndo">撤销最后一段</button>
          <button id="btnClearSelection">取消选择</button>
          <button id="btnClear" class="danger">清空</button>
        </div>

        <div class="toolbar-group">
          <button id="btnExport" class="primary">导出当前路径</button>
          <button id="btnSaveLocal" class="success">保存到本地缓存</button>
          <button id="btnLoadLocal">从本地缓存加载</button>
        </div>

        <div class="hint">
          滚轮缩放；中键/空格拖拽平移；选择模式下拖拽空白区域框选；选中多个点后拖任意选中点可整体移动。
        </div>
      </div>

      <div class="stage-wrap">
        <svg id="stage" class="mode-pen"></svg>
        <div class="hud" id="hud"></div>
      </div>
    </div>

    <div class="right">
      <div class="panel">
        <h3>当前路径信息</h3>
        <div class="stats" id="stats">尚未创建路径</div>
      </div>

      <div class="panel">
        <h3>导出结果</h3>
        <p>导出格式为：<code>c1x,c1y,c2x,c2y,endX,endY&...</code></p>
        <p>首段起点不在 <code>logo</code> 字符串内，因此额外输出 <code>firstStartX</code> / <code>firstStartY</code>。</p>
      </div>

      <textarea id="output" placeholder="点击“导出当前路径”后，这里会生成结果...\n也可以把之前导出的内容粘贴到这里，然后点击“从文本导入”。"></textarea>

      <div class="footer-actions">
        <button id="btnCopy" class="success">复制输出</button>
        <button id="btnImportText">从文本导入</button>
        <button id="btnLoadDemo">加载演示路径</button>
        <button id="btnClearLocal" class="danger">清除本地缓存</button>
      </div>
    </div>
  </div>

  <script>
    const svg = document.getElementById("stage");
    const output = document.getElementById("output");
    const stats = document.getElementById("stats");
    const hud = document.getElementById("hud");

    const modePen = document.getElementById("modePen");
    const modeSelect = document.getElementById("modeSelect");
    const modePan = document.getElementById("modePan");
    const btnZoomIn = document.getElementById("btnZoomIn");
    const btnZoomOut = document.getElementById("btnZoomOut");
    const btnResetView = document.getElementById("btnResetView");
    const btnUndo = document.getElementById("btnUndo");
    const btnClearSelection = document.getElementById("btnClearSelection");
    const btnClear = document.getElementById("btnClear");
    const btnExport = document.getElementById("btnExport");
    const btnSaveLocal = document.getElementById("btnSaveLocal");
    const btnLoadLocal = document.getElementById("btnLoadLocal");
    const btnCopy = document.getElementById("btnCopy");
    const btnImportText = document.getElementById("btnImportText");
    const btnLoadDemo = document.getElementById("btnLoadDemo");
    const btnClearLocal = document.getElementById("btnClearLocal");

    const SVG_NS = "http://www.w3.org/2000/svg";
    const STORAGE_KEY = "bezier-pen-tool-path-cache-v2";

    const state = {
      mode: "pen", // pen | select | pan
      startPoint: null, // { x, y }
      segments: [], // [{ c1:{x,y}, c2:{x,y}, end:{x,y} }]
      selectedKeys: new Set(),
      view: {
        zoom: 1,
        panX: 0,
        panY: 0
      },
      pointer: {
        type: null, // group-drag | marquee | pan | pen-click
        originWorld: null,
        originScreen: null,
        initialPoints: null,
        additive: false,
        moved: false
      },
      marquee: null,
      spaceDown: false,
      lastDragEndAt: 0,
      status: ""
    };

    function createSVG(tag, attrs = {}) {
      const el = document.createElementNS(SVG_NS, tag);
      for (const [key, value] of Object.entries(attrs)) {
        el.setAttribute(key, value);
      }
      return el;
    }

    function clonePoint(p) {
      return { x: p.x, y: p.y };
    }

    function fmt(n) {
      return Number(n).toFixed(1);
    }

    function setStatus(message) {
      state.status = message || "";
      updateHud();
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function getStageRect() {
      return svg.getBoundingClientRect();
    }

    function screenPointFromEvent(evt) {
      const rect = getStageRect();
      return {
        x: evt.clientX - rect.left,
        y: evt.clientY - rect.top
      };
    }

    function screenToWorldFromScreen(screen) {
      const { zoom, panX, panY } = state.view;
      return {
        x: (screen.x - panX) / zoom,
        y: (screen.y - panY) / zoom
      };
    }

    function screenToWorld(evt) {
      return screenToWorldFromScreen(screenPointFromEvent(evt));
    }

    function keyOf(type, index) {
      return `${type}:${index}`;
    }

    function parseKey(key) {
      const [type, index] = key.split(":");
      return { type, index: Number(index) };
    }

    function getPointByKey(key) {
      const { type, index } = parseKey(key);

      if (type === "start") return state.startPoint;
      const seg = state.segments[index];
      if (!seg) return null;

      if (type === "c1") return seg.c1;
      if (type === "c2") return seg.c2;
      if (type === "end") return seg.end;
      return null;
    }

    function getAllHandles() {
      const handles = [];

      if (state.startPoint) {
        handles.push({
          key: keyOf("start", -1),
          type: "start",
          index: -1,
          point: state.startPoint,
          label: "start"
        });
      }

      state.segments.forEach((seg, index) => {
        handles.push({ key: keyOf("c1", index), type: "c1", index, point: seg.c1, label: `c1-${index}` });
        handles.push({ key: keyOf("c2", index), type: "c2", index, point: seg.c2, label: `c2-${index}` });
        handles.push({ key: keyOf("end", index), type: "end", index, point: seg.end, label: `end-${index}` });
      });

      return handles;
    }

    function getSegmentStart(index) {
      if (index === 0) return state.startPoint;
      return state.segments[index - 1].end;
    }

    function currentEndPoint() {
      if (state.segments.length > 0) {
        return state.segments[state.segments.length - 1].end;
      }
      return state.startPoint;
    }

    function buildPathD() {
      if (!state.startPoint) return "";

      let d = `M ${fmt(state.startPoint.x)} ${fmt(state.startPoint.y)}`;
      for (const seg of state.segments) {
        d += ` C ${fmt(seg.c1.x)} ${fmt(seg.c1.y)}, ${fmt(seg.c2.x)} ${fmt(seg.c2.y)}, ${fmt(seg.end.x)} ${fmt(seg.end.y)}`;
      }
      return d;
    }

    function addSegment(endPoint) {
      if (!state.startPoint) {
        state.startPoint = clonePoint(endPoint);
        state.selectedKeys = new Set([keyOf("start", -1)]);
        setStatus("已设置起点");
        render();
        return;
      }

      const start = currentEndPoint();
      const dx = endPoint.x - start.x;
      const dy = endPoint.y - start.y;

      const seg = {
        c1: {
          x: start.x + dx / 3,
          y: start.y + dy / 3
        },
        c2: {
          x: start.x + (dx * 2) / 3,
          y: start.y + (dy * 2) / 3
        },
        end: clonePoint(endPoint)
      };

      state.segments.push(seg);
      state.selectedKeys = new Set([keyOf("end", state.segments.length - 1)]);
      setStatus(`已新增第 ${state.segments.length} 段曲线`);
      render();
    }

    function selectOnly(key) {
      state.selectedKeys = new Set([key]);
    }

    function toggleSelection(key) {
      if (state.selectedKeys.has(key)) {
        state.selectedKeys.delete(key);
      } else {
        state.selectedKeys.add(key);
      }
    }

    function clearSelection() {
      state.selectedKeys.clear();
      render();
    }

    function isPointInRect(point, rect) {
      const minX = Math.min(rect.x1, rect.x2);
      const maxX = Math.max(rect.x1, rect.x2);
      const minY = Math.min(rect.y1, rect.y2);
      const maxY = Math.max(rect.y1, rect.y2);

      return point.x >= minX && point.x <= maxX && point.y >= minY && point.y <= maxY;
    }

    function createSelectionSnapshot(keys) {
      const map = new Map();
      keys.forEach(key => {
        const point = getPointByKey(key);
        if (point) {
          map.set(key, { x: point.x, y: point.y });
        }
      });
      return map;
    }

    function applyGroupDrag(deltaX, deltaY) {
      const snapshot = state.pointer.initialPoints;
      if (!snapshot) return;

      snapshot.forEach((initial, key) => {
        const point = getPointByKey(key);
        if (!point) return;
        point.x = initial.x + deltaX;
        point.y = initial.y + deltaY;
      });
    }

    function updateMarqueeSelection() {
      if (!state.marquee) return;

      const next = state.pointer.additive
        ? new Set(state.pointer.initialSelection || [])
        : new Set();

      getAllHandles().forEach(handle => {
        if (isPointInRect(handle.point, state.marquee)) {
          next.add(handle.key);
        }
      });

      state.selectedKeys = next;
    }

    function setMode(mode) {
      state.mode = mode;

      modePen.classList.toggle("active", mode === "pen");
      modeSelect.classList.toggle("active", mode === "select");
      modePan.classList.toggle("active", mode === "pan");

      svg.classList.toggle("mode-pen", mode === "pen");
      svg.classList.toggle("mode-select", mode === "select");
      svg.classList.toggle("mode-pan", mode === "pan");

      setStatus(mode === "pen" ? "钢笔模式：点击空白区域新增曲线段" : mode === "select" ? "选择模式：拖拽空白区域框选点" : "平移模式：拖动画布移动视图");
    }

    function zoomAtScreen(screen, factor) {
      const oldZoom = state.view.zoom;
      const nextZoom = clamp(oldZoom * factor, 0.15, 8);
      const world = screenToWorldFromScreen(screen);

      state.view.zoom = nextZoom;
      state.view.panX = screen.x - world.x * nextZoom;
      state.view.panY = screen.y - world.y * nextZoom;

      render();
    }

    function zoomByButton(factor) {
      const rect = getStageRect();
      zoomAtScreen({ x: rect.width / 2, y: rect.height / 2 }, factor);
    }

    function resetView() {
      state.view.zoom = 1;
      state.view.panX = 0;
      state.view.panY = 0;
      render();
    }

    function exportPath({ silent = false } = {}) {
      if (!state.startPoint || state.segments.length === 0) {
        if (!silent) {
          output.value = "请先绘制至少一段曲线。";
        }
        return "";
      }

      const logo = state.segments
        .map(seg => [
          fmt(seg.c1.x),
          fmt(seg.c1.y),
          fmt(seg.c2.x),
          fmt(seg.c2.y),
          fmt(seg.end.x),
          fmt(seg.end.y)
        ].join(","))
        .join("&");

      const text = [
        `firstStartX = ${fmt(state.startPoint.x)};`,
        `firstStartY = ${fmt(state.startPoint.y)};`,
        `noPoints = ${state.segments.length};`,
        ``,
        `logo = "${logo}";`
      ].join("\n");

      if (!silent) {
        output.value = text;
        setStatus("已导出当前路径");
      }

      return text;
    }

    function saveLocal() {
      const data = {
        version: 2,
        updatedAt: new Date().toISOString(),
        startPoint: state.startPoint,
        segments: state.segments,
        view: state.view
      };

      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      setStatus("已保存到本地缓存 localStorage");
    }

    function loadLocal() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        alert("本地缓存中没有已保存的路径。存储位置：localStorage");
        return;
      }

      try {
        const data = JSON.parse(raw);
        state.startPoint = data.startPoint || null;
        state.segments = Array.isArray(data.segments) ? data.segments : [];
        state.view = data.view || { zoom: 1, panX: 0, panY: 0 };
        state.selectedKeys.clear();
        render();
        exportPath();
        setStatus(`已加载本地缓存：${data.updatedAt || "未知时间"}`);
      } catch (error) {
        alert("本地缓存解析失败，数据可能已损坏。请清除后重新保存。 ");
      }
    }

    function clearLocal() {
      localStorage.removeItem(STORAGE_KEY);
      setStatus("已清除本地缓存");
    }

    function parseExportedText(text) {
      const startXMatch = text.match(/firstStartX\s*=\s*(-?\d+(?:\.\d+)?)/);
      const startYMatch = text.match(/firstStartY\s*=\s*(-?\d+(?:\.\d+)?)/);
      const logoMatch = text.match(/logo\s*=\s*["']([^"']+)["']/);

      if (!startXMatch || !startYMatch || !logoMatch) {
        throw new Error("没有找到 firstStartX、firstStartY 或 logo。 ");
      }

      const startPoint = {
        x: Number(startXMatch[1]),
        y: Number(startYMatch[1])
      };

      const segments = logoMatch[1]
        .split("&")
        .filter(Boolean)
        .map(chunk => {
          const nums = chunk.split(",").map(Number);
          if (nums.length !== 6 || nums.some(Number.isNaN)) {
            throw new Error("logo 路径格式不正确。每段必须是 6 个数字。 ");
          }
          return {
            c1: { x: nums[0], y: nums[1] },
            c2: { x: nums[2], y: nums[3] },
            end: { x: nums[4], y: nums[5] }
          };
        });

      return { startPoint, segments };
    }

    function importFromText() {
      try {
        const parsed = parseExportedText(output.value);
        state.startPoint = parsed.startPoint;
        state.segments = parsed.segments;
        state.selectedKeys.clear();
        render();
        setStatus("已从文本导入路径");
      } catch (error) {
        alert(`导入失败：${error.message}`);
      }
    }

    function updateStats() {
      if (!state.startPoint) {
        stats.innerHTML = "尚未创建路径";
        return;
      }

      const d = buildPathD();
      stats.innerHTML = `
        <div>起点：(${fmt(state.startPoint.x)}, ${fmt(state.startPoint.y)})</div>
        <div>段数：${state.segments.length}</div>
        <div>选中点数：${state.selectedKeys.size}</div>
        <div>缩放：${Math.round(state.view.zoom * 100)}%</div>
        <div>SVG Path：</div>
        <div style="margin-top:6px; color:#bfe9df; word-break:break-all;">${escapeHtml(d)}</div>
      `;
    }

    function updateHud() {
      hud.innerHTML = `
        <div>模式：${state.mode === "pen" ? "钢笔" : state.mode === "select" ? "选择/框选" : "平移"}</div>
        <div>缩放：${Math.round(state.view.zoom * 100)}%</div>
        <div>点数：${getAllHandles().length}，选中：${state.selectedKeys.size}</div>
        <div>${escapeHtml(state.status || "滚轮缩放，中键/空格平移")}</div>
      `;
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function drawHandle(layer, handle) {
      const zoom = state.view.zoom;
      const isSelected = state.selectedKeys.has(handle.key);
      const r = handle.type === "c1" || handle.type === "c2" ? 6 / zoom : 7 / zoom;
      const strokeWidth = isSelected ? 4 / zoom : 2 / zoom;
      const className = [
        handle.type === "start" ? "start-point" : handle.type === "end" ? "anchor" : "control",
        isSelected ? "selected-point" : ""
      ].filter(Boolean).join(" ");

      const circle = createSVG("circle", {
        cx: handle.point.x,
        cy: handle.point.y,
        r,
        class: className,
        "data-key": handle.key,
        "stroke-width": strokeWidth
      });
      layer.appendChild(circle);

      const label = createSVG("text", {
        x: handle.point.x + 10 / zoom,
        y: handle.point.y - 10 / zoom,
        class: "label",
        "font-size": 12 / zoom
      });
      label.textContent = handle.label;
      layer.appendChild(label);
    }

    function render() {
      svg.innerHTML = "";

      const rect = getStageRect();
      const width = Math.max(1, rect.width);
      const height = Math.max(1, rect.height);
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);

      const viewport = createSVG("g", {
        transform: `translate(${state.view.panX} ${state.view.panY}) scale(${state.view.zoom})`
      });
      svg.appendChild(viewport);

      const d = buildPathD();
      if (d) {
        viewport.appendChild(createSVG("path", { d, class: "ghost-path" }));

            y1: segStart.y,

            y1: seg.end.y,
            x2: seg.c2.x,

    function handlePointerDown(evt) {

      const world = screenToWorldFromScreen(screen);

        state.pointer = {
          type: "pan",
          originScreen: screen,
          originWorld: world,
          initialView: { ...state.view },
          moved: false
        };

      if (key) {
        evt.preventDefault();

        if (evt.shiftKey) {
          toggleSelection(key);
        } else if (!state.selectedKeys.has(key)) {
          selectOnly(key);
        }

        state.pointer = {
          type: "group-drag",
          originWorld: world,
          originScreen: screen,
          initialPoints: createSelectionSnapshot(state.selectedKeys),
          moved: false
        };

        render();
        return;

          originScreen: screen,
          additive: evt.shiftKey,
          initialSelection: new Set(state.selectedKeys),

          originWorld: world,
          originScreen: screen,
          moved: false
        };
      }

    function handlePointerMove(evt) {
      if (!state.pointer || !state.pointer.type) return;

      const screen = screenPointFromEvent(evt);
      const world = screenToWorldFromScreen(screen);
      const dxScreen = screen.x - state.pointer.originScreen.x;
      const dyScreen = screen.y - state.pointer.originScreen.y;
      const dxWorld = world.x - state.pointer.originWorld.x;
      const dyWorld = world.y - state.pointer.originWorld.y;

      if (Math.abs(dxScreen) > 2 || Math.abs(dyScreen) > 2) {
        state.pointer.moved = true;
      }

      if (state.pointer.type === "pan") {
        state.view.panX = state.pointer.initialView.panX + dxScreen;
        state.view.panY = state.pointer.initialView.panY + dyScreen;
        render();
        return;
      }

      if (state.pointer.type === "group-drag") {
        applyGroupDrag(dxWorld, dyWorld);
        render();
        return;
      }

      if (state.pointer.type === "marquee") {
        state.marquee.x2 = world.x;
        state.marquee.y2 = world.y;
        updateMarqueeSelection();
        render();
      }
    }

    function handlePointerUp(evt) {
      if (!state.pointer || !state.pointer.type) return;

      const type = state.pointer.type;
      const moved = state.pointer.moved;
      const world = screenToWorld(evt);

      if (type === "pen-click" && !moved) {
        addSegment(world);
      }

      if (type === "marquee") {
        updateMarqueeSelection();
        state.marquee = null;
        setStatus(`已框选 ${state.selectedKeys.size} 个点`);
      }

      if (type === "group-drag" && moved) {
        setStatus(`已整体移动 ${state.selectedKeys.size} 个点`);
      }

      if (type === "pan") {
        svg.classList.remove("panning");
      }

      if (moved) {
        state.lastDragEndAt = Date.now();
      }

      state.pointer = { type: null };
      render();
    }

      evt.preventDefault();
      const screen = screenPointFromEvent(evt);
      const factor = evt.deltaY < 0 ? 1.12 : 1 / 1.12;
      zoomAtScreen(screen, factor);
    }

        state.segments.pop();
      } else {
        state.startPoint = null;
      }
      state.selectedKeys.clear();
      setStatus("已撤销最后一段");

    modeSelect.addEventListener("click", () => setMode("select"));
    modePan.addEventListener("click", () => setMode("pan"));

    btnResetView.addEventListener("click", resetView);
